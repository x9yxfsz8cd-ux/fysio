<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0F1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07070B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fysio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fysio</title>
<style>
/* Fysio — iOS-taal: grouped backgrounds, SF Pro voor tekst, SF Rounded voor cijfers.
   Grijzig blauw-paars als enige accent; groen alleen voor "gehaald".
   Alle maten in rem: rem volgt de iOS-tekstgrootte via -apple-system-body. */
:root{
  --bg:#F0F1F6; --card:#FFFFFF; --fg:#15161F; --fg2:#5D5F75; --fg3:#6E7087;
  --sep:rgba(60,62,100,.13); --fill:rgba(100,104,150,.1); --fill2:rgba(100,104,150,.18);
  --accent:#5B5FB0; --accent-ink:#FFFFFF; --accent-soft:#E7E8F6;
  --tile-a:#F1F1FA; --tile-b:#DEE0F1; --green:#2A8F60; --green-soft:#DFF2E8;
  --warn:#B4541A; --warn-soft:#FBEADF; --red:#D6453D;
  --bar:rgba(248,248,252,.86); --shadow:0 1px 2px rgba(20,20,60,.04),0 6px 20px rgba(20,20,60,.05);
  --dim:rgba(10,10,30,.34);
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#07070B; --card:#16171F; --fg:#F3F3F8; --fg2:#A2A4B8; --fg3:#7A7C92;
  --sep:rgba(140,142,180,.2); --fill:rgba(140,142,180,.16); --fill2:rgba(140,142,180,.26);
  --accent:#A5A8EE; --accent-ink:#171845; --accent-soft:rgba(165,168,238,.15);
  --tile-a:#191A2A; --tile-b:#222439; --green:#56CC90; --green-soft:rgba(86,204,144,.15);
  --warn:#F2A66E; --warn-soft:rgba(242,166,110,.14); --red:#FF6259;
  --bar:rgba(18,18,26,.84); --shadow:none; --dim:rgba(0,0,0,.55); color-scheme:dark}}

html{font-size:17px;font:-apple-system-body;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);-webkit-font-smoothing:antialiased;
  min-height:100vh;overscroll-behavior-y:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
body.vast{overflow:hidden}

/* ---------- schermen ---------- */
.screen{display:none;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 1rem) 1.2rem calc(env(safe-area-inset-bottom,0px) + 6.5rem)}
.screen.on{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.screen.modal{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-size:.78rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:.4rem 0 .1rem}
.large{font-size:2rem;font-weight:700;letter-spacing:.01em;margin:0 0 1rem;line-height:1.1}
.title2{font-size:1.3rem;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.2;text-wrap:balance}
.sub{font-size:.9rem;color:var(--fg2);line-height:1.4}
.section{font-size:1.18rem;font-weight:700;margin:1.7rem 0 .6rem;letter-spacing:-.01em}
.foot{font-size:.78rem;color:var(--fg3);margin:.5rem .25rem 0;line-height:1.4}
.card{background:var(--card);border-radius:1.3rem;box-shadow:var(--shadow)}

.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.2rem;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-size:1rem;font-weight:600;padding:0 1.2rem;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.soft{background:var(--fill);color:var(--fg)}
.btn.klein{min-height:2.6rem;width:auto;font-size:.9rem}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 .6rem transparent}}
.link{color:var(--accent);font-size:1rem;font-weight:500;padding:.6rem .3rem;min-height:2.75rem}

/* ---------- Vandaag ---------- */
.week{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;margin-bottom:.8rem}
.ring{position:relative;flex:0 0 auto}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .trk{fill:none;stroke:var(--fill2)}
.ring .val{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.3,.9,.2,1)}
.ring.groen .val{stroke:var(--green)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.week .ring{width:4rem;height:4rem}
.week .ring .trk,.week .ring .val{stroke-width:9}
.week .mid b{font:700 1rem var(--round);color:var(--fg2)}
.week .ring.groen .mid{color:var(--green)}
.week-txt{min-width:0}
.week-txt b{display:block;font-size:1rem;font-weight:600;margin-bottom:.1rem}
.days{display:flex;gap:.3rem;margin-top:.5rem}
.day{width:1.3rem;text-align:center;font-size:.65rem;color:var(--fg3);font-weight:600}
.day i{display:block;width:.5rem;height:.5rem;border-radius:50%;background:var(--fill2);margin:0 auto .25rem}
.day.done i{background:var(--green)}
.day.nu{color:var(--fg)}

.melding{display:flex;gap:.75rem;align-items:flex-start;padding:.9rem 1rem;margin-bottom:.8rem;border-radius:1.1rem;font-size:.9rem;line-height:1.4}
.melding svg{flex:0 0 auto;margin-top:.1rem}
.melding.warn{background:var(--warn-soft);color:var(--fg)}
.melding.warn svg{color:var(--warn)}
.melding b{display:block}

.hero{overflow:hidden}
.hero-art{height:clamp(7rem,19vh,10rem);display:grid;place-items:center;background:linear-gradient(160deg,var(--tile-a),var(--tile-b))}
.hero-art svg{height:88%}
.hero-body{padding:1rem 1.1rem 1.1rem}
.label{font-size:.78rem;font-weight:600;color:var(--accent);margin-bottom:.2rem}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin:.45rem 0 .5rem;font-size:.9rem;color:var(--fg2)}
.meta span{display:inline-flex;align-items:center;gap:.3rem}
.hero-note{font-size:.85rem;color:var(--fg2);margin-bottom:.9rem}
.hervat{padding:1rem 1.1rem;margin-bottom:.8rem;background:var(--accent-soft);border-radius:1.2rem}
.hervat .rij{display:flex;gap:.5rem;margin-top:.8rem}
.hervat .btn.soft{width:auto;background:var(--card)}

/* Grouped list */
.list{background:var(--card);border-radius:1.1rem;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:.85rem;padding:.65rem 1rem;position:relative;width:100%;min-height:3.6rem}
.row+.row::before{content:"";position:absolute;top:0;left:4.4rem;right:0;height:1px;background:var(--sep)}
.row.plain+.row.plain::before{left:1rem}
button.row:active{background:var(--fill)}
.thumb{flex:0 0 2.75rem;height:2.75rem;border-radius:.75rem;background:linear-gradient(160deg,var(--tile-a),var(--tile-b));display:grid;place-items:center}
.thumb svg{width:2.4rem;height:2.4rem}
.row-main{flex:1;min-width:0}
.row-t{font-size:1rem;line-height:1.25}
.row-s{font-size:.82rem;color:var(--fg2);margin-top:.1rem}
.chev{color:var(--fg3);flex:0 0 auto}
.blok{font-size:.78rem;color:var(--fg2);margin:1.3rem 1rem .45rem;text-transform:uppercase;letter-spacing:.03em;font-weight:500}
.check{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--fill2);display:grid;place-items:center;color:transparent}
.gekozen .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Tabbalk */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;justify-content:center;
  padding:.45rem 1rem calc(env(safe-area-inset-bottom,0px) + .45rem);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--sep)}
.tabbar.on{display:flex}
.tabbar-in{display:flex;justify-content:space-around;width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.62rem;font-weight:500;color:var(--fg3);min-width:4.5rem;min-height:2.9rem;justify-content:center}
.tab.on{color:var(--accent)}
.kiesbalk{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4.2rem);z-index:14;padding:0 1.2rem;display:none}
.kiesbalk.on{display:block}
.kiesbalk .btn{max-width:520px;margin:0 auto;box-shadow:0 8px 24px rgba(20,20,60,.18)}

/* ---------- Sheets ---------- */
.dim{position:fixed;inset:0;z-index:25;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:92vh;overflow-y:auto;background:var(--bg);
  border-radius:.9rem .9rem 0 0;padding:.5rem 1.2rem calc(env(safe-area-inset-bottom,0px) + 1.4rem);
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:2.2rem;height:.3rem;border-radius:3px;background:var(--fill2);margin:0 auto .85rem}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.35rem}
.x{flex:0 0 2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;color:var(--fg2);margin:-.4rem -.4rem 0 0}
.x span{width:1.8rem;height:1.8rem;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.need{display:flex;flex-direction:column;gap:0;margin:.9rem 0 .2rem}
.sheet-cta{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 1.4rem));padding:1rem 0 calc(env(safe-area-inset-bottom,0px) + 1.4rem);margin-bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 1.4rem));background:linear-gradient(to top,var(--bg) 75%,transparent)}
.segwide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:.6rem;padding:2px;gap:2px;margin:.2rem 0 .9rem}
.segwide button{min-height:2.2rem;border-radius:.5rem;font-size:.82rem;font-weight:600;text-align:center}
.segwide button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ---------- Training ---------- */
.wk-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6rem;margin:0 -1.2rem .6rem;padding:calc(env(safe-area-inset-top,0px) + .4rem) 1.2rem .5rem;
  background:var(--bg)}
#s-oefening,#s-pauze{padding-top:0}
.prog{flex:1;min-width:0}
.prog-bar{display:flex;gap:2px;height:.25rem}
.prog-bar i{flex:1;border-radius:2px;background:var(--fill2)}
.prog-bar i.d{background:var(--accent)}
.prog-t{font-size:.72rem;color:var(--fg2);text-align:center;margin-top:.3rem;font-variant-numeric:tabular-nums}
.rond{flex:0 0 2.75rem;height:2.75rem;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--fg)}
.art{height:clamp(8.5rem,26vh,17rem);border-radius:1.6rem;background:linear-gradient(160deg,var(--tile-a),var(--tile-b));
  display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{height:86%}
.art .how{position:absolute;right:.7rem;top:.7rem;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--card);padding:.5rem .8rem;border-radius:999px;min-height:2.2rem}
.banner{display:flex;align-items:center;gap:.5rem;justify-content:center;font-size:.9rem;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:.55rem .9rem;margin-bottom:.7rem}
.wk-when{font-size:.9rem;font-weight:600;color:var(--accent);margin:.95rem 0 .2rem}
.wk-name{font-size:1.65rem;font-weight:700;letter-spacing:-.01em;line-height:1.12;margin:0 0 .2rem;text-wrap:balance}
.wk-plain{font-size:.94rem;color:var(--fg2);margin-bottom:.8rem;line-height:1.35}
.wk-plain span{color:var(--fg3)}
.reps{display:flex;align-items:center;gap:.9rem;margin-bottom:.8rem}
.reps .n{font:700 3.4rem/1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.reps-side{display:flex;flex-direction:column;gap:.1rem;font-size:.9rem;color:var(--fg2);min-width:0}
.reps-side b{font-size:1.18rem;font-weight:600;color:var(--fg)}
.hold{display:flex;align-items:center;gap:1rem;margin-bottom:.8rem}
.hold .ring{width:6.2rem;height:6.2rem;cursor:pointer}
.hold .ring .trk,.hold .ring .val{stroke-width:10}
.hold .n{font:700 1.9rem/1 var(--round);font-variant-numeric:tabular-nums}
.hold .l{font-size:.68rem;color:var(--fg2);margin-top:.15rem}
.hold .l.wissel{color:var(--accent);font-weight:700}
.cue{display:flex;gap:.6rem;align-items:flex-start;background:var(--card);border-radius:1rem;padding:.75rem .85rem;font-size:.9rem;line-height:1.4;color:var(--fg2);box-shadow:var(--shadow)}
.cue svg{flex:0 0 auto;color:var(--accent);margin-top:.1rem}
.wk-foot{position:sticky;bottom:0;margin-top:1rem;padding:.8rem 0 calc(env(safe-area-inset-bottom,0px) + .6rem);background:linear-gradient(to top,var(--bg) 80%,transparent)}

/* Figuren: dikke ronde lijnen, gevuld hoofd — pictogramstijl */
.fig{fill:none;stroke:var(--fg);stroke-width:6.2;stroke-linecap:round;stroke-linejoin:round}
.fig circle:not(.gear){fill:var(--fg);stroke-width:2}
.fig .gear{stroke:var(--accent);fill:var(--accent);stroke-width:2.5}
.fig .band{stroke:var(--accent);stroke-width:3;opacity:.9}
.fig-g{fill:none;stroke:var(--fg3);stroke-width:2.5;opacity:.45;stroke-linecap:round}
.anim .pose-a{animation:poseA 3.4s ease-in-out infinite}
.anim .pose-b{animation:poseB 3.4s ease-in-out infinite}
@keyframes poseA{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@keyframes poseB{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}

/* ---------- Pauze ---------- */
.rest{display:flex;flex-direction:column;align-items:center;text-align:center}
.rest .ring{width:min(13rem,30vh);height:min(13rem,30vh);margin:1rem 0 1rem}
.rest .ring .trk,.rest .ring .val{stroke-width:13}
.rest .ring .val{transition:stroke-dashoffset .3s linear}
.rest .n{font:700 min(4.2rem,9vh)/1 var(--round);font-variant-numeric:tabular-nums}
.rest .l{font-size:.9rem;color:var(--fg2);margin-top:.25rem}
.next{display:flex;align-items:center;gap:.85rem;width:100%;padding:.75rem .85rem;margin:1.1rem 0}
.duo{display:flex;gap:.6rem;width:100%}
.rest .duo{position:sticky;bottom:0;padding:.8rem 0 calc(env(safe-area-inset-bottom,0px) + .6rem);background:linear-gradient(to top,var(--bg) 80%,transparent)}
.large{overflow-wrap:anywhere}

/* ---------- Klaar ---------- */
.done{text-align:center}
.done .ring{width:8rem;height:8rem;margin:1.4rem auto .9rem}
.done .ring .trk,.done .ring .val{stroke-width:12}
.done .ring .mid{color:var(--green)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.1rem 0 .4rem}
.stat{padding:.85rem}
.stat .n{font:700 1.75rem/1.1 var(--round);font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--fg2);margin-top:.1rem}
.ask{text-align:left;padding:1rem;margin-top:.8rem}
.ask h3{font-size:1rem;font-weight:600;margin:0 0 .7rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:.6rem;padding:2px;gap:2px}
.seg button{min-height:2.4rem;border-radius:.5rem;font-size:.82rem;font-weight:500;text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.pijn-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.pijn-top b{font:700 1.65rem var(--round);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:2.2rem;margin:0}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--fg3)}

/* ---------- Voortgang ---------- */
.big{display:flex;align-items:center;gap:1rem;padding:1.1rem}
.big .ring{width:4rem;height:4rem}
.big .ring .trk,.big .ring .val{stroke-width:9}
.big .n{font:700 2.8rem/1 var(--round)}
.weeks{display:flex;gap:.45rem;margin-top:.85rem;padding:0 .1rem}
.wkb{flex:1;text-align:center;font-size:.62rem;color:var(--fg3);min-width:0}
.wkb i{display:block;height:2rem;border-radius:.5rem;background:var(--fill);margin-bottom:.3rem}
.wkb.on i{background:var(--green)}
.pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:.2rem .5rem;background:var(--fill);color:var(--fg2);white-space:nowrap}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.leeg{padding:1.2rem 1rem;text-align:center;color:var(--fg2);font-size:.9rem}

/* ---------- Oefeningen ---------- */
.navrij{display:flex;justify-content:space-between;align-items:center;min-height:2.75rem;margin-bottom:-.4rem}
.navrij .link{padding:.5rem 0 .5rem .8rem}
.search{display:flex;align-items:center;gap:.5rem;height:2.4rem;border-radius:.7rem;background:var(--fill);padding:0 .65rem;color:var(--fg3);margin-bottom:.7rem}
.search input{flex:1;border:none;background:none;outline:none;font-size:1rem;color:var(--fg);min-width:0}
.search input::placeholder{color:var(--fg3)}

/* Uitleg */
.how-art{height:13rem;border-radius:1.4rem;background:linear-gradient(160deg,var(--tile-a),var(--tile-b));display:grid;place-items:center;margin:.7rem 0 1rem}
.how-art svg{height:11rem}
.steps{display:flex;flex-direction:column;gap:.6rem}
.step{display:flex;gap:.8rem;align-items:center;padding:.75rem .85rem}
.step .num{flex:0 0 1.7rem;height:1.7rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .9rem var(--round)}
.step p{margin:0;font-size:.94rem;line-height:1.4;flex:1;min-width:0}
.step .thumb{flex-basis:3.1rem;height:3.1rem}

/* Actiemenu */
.acts{position:fixed;left:.6rem;right:.6rem;bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);z-index:31;display:flex;flex-direction:column;gap:.5rem;
  transform:translateY(130%);transition:transform .36s cubic-bezier(.2,.9,.2,1);max-width:540px;margin:0 auto}
.acts.on{transform:none}
.acts .grp{background:var(--card);border-radius:.85rem;overflow:hidden}
.acts button{display:block;width:100%;min-height:3.3rem;font-size:1.1rem;color:var(--accent);text-align:center}
.acts .grp button+button{border-top:1px solid var(--sep)}
.acts .rood{color:var(--red)}
.acts .vet{font-weight:600}

/* Pauze-overlay */
.paus{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem}
.paus.on{display:flex;animation:in .25s ease-out}
.paus .ico{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:1.2rem}
.paus .knoppen{display:flex;flex-direction:column;gap:.5rem;width:100%;max-width:22rem;margin-top:2rem}

/* Ongedaan maken */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 5.2rem);z-index:35;transform:translate(-50%,.5rem);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:.8rem;background:var(--fg);color:var(--bg);border-radius:999px;padding:.35rem .35rem .35rem 1.1rem;font-size:.9rem;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:rgba(127,127,160,.35);color:inherit;font-weight:600;border-radius:999px;padding:0 .9rem;min-height:2.4rem;font-size:.9rem}

/* Welkom */
.welcome{display:flex;flex-direction:column;min-height:calc(100vh - 3rem)}
.w-mark{width:5rem;height:5rem;border-radius:1.3rem;background:linear-gradient(160deg,#8C90DA,#4E52A3);display:grid;place-items:center;margin:2.2rem auto 1.3rem;box-shadow:0 12px 30px rgba(78,82,163,.3)}
.w-t{font-size:1.9rem;font-weight:700;text-align:center;letter-spacing:-.01em;margin:0 0 1.8rem;line-height:1.15}
.w-item{display:flex;gap:1rem;align-items:flex-start;margin:0 .4rem 1.4rem}
.w-item svg{flex:0 0 auto;color:var(--accent)}
.w-item b{display:block;font-size:1rem;font-weight:600;margin-bottom:.1rem}
.w-item span{font-size:.9rem;color:var(--fg2);line-height:1.4}

@media (min-width:700px){.screen{padding-top:2.5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.anim .pose-b{opacity:0}}
</style>
</head>
<body>

<!-- WELKOM (alleen de eerste keer) -->

const REST_SECS=75, WEEKDOEL=1;

// ================= Hulpjes =================
const $=id=>document.getElementById(id);
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}},
};
const K_HIST='fysio-v6',K_LOPEND='fysio-lopend',K_WELKOM='fysio-welkom';
let hist=LS.get(K_HIST,[]);if(!Array.isArray(hist))hist=[];
const bewaarHist=()=>LS.set(K_HIST,hist);

const naamVan=o=>(NL[o.naam]||[o.naam])[0];
const uitlegVan=o=>(NL[o.naam]||[,''])[1];
function kgVan(o){const m=(o.notitie||'').match(/\d+(?:[.,]\d+)?\s*kg/i);return m?m[0].replace(/\s+/g,' '):null;}
function perKant(o){const nt=(o.notitie||'').toLowerCase();return ALTIJD_PER_KANT.includes(o.naam)||nt.includes('kant')||nt.includes('been');}
const isHold=o=>/^\d+\s*s$/i.test(o.reps);
const holdTotaal=o=>parseInt(o.reps)*(perKant(o)?2:1);
function spullen(o){
  const kg=kgVan(o),g=GEAR_NL[o.gear];
  if(!g) return kg||'geen spullen nodig';
  return kg?`${kg} ${g}`:g.charAt(0).toUpperCase()+g.slice(1);
}
const hoeveel=o=>isHold(o)?`${parseInt(o.reps)} sec vasthouden`:`${o.reps} keer`;
const kort=o=>`${hoeveel(o)} · ${o.sets} ${o.sets===1?'ronde':'rondes'}${perKant(o)?' · links en rechts':''}`;
function setDuur(o){
  if(isHold(o)) return holdTotaal(o);
  const p=o.reps.split(/[–\-]/),avg=p.length===2?(parseInt(p[0])+parseInt(p[1]))/2:parseInt(p[0]);
  return Math.round(avg*(SPR[o.naam]||3)*(perKant(o)?2:1));
}
const groep=o=>o.super?o.super.replace(/[A-Z]$/,''):null;
const zelfdeGroep=(a,b)=>!!a.super&&!!b.super&&groep(a)===groep(b);
function volgorde(exs){ // per groep om de beurt, ronde voor ronde
  const groepen={};
  exs.forEach((o,i)=>{const g=groep(o)??('x'+i);(groepen[g]=groepen[g]||[]).push(i);});
  const max=Math.max(...exs.map(o=>o.sets)),v=[];
  for(let r=0;r<max;r++) for(const g of Object.keys(groepen)) for(const e of groepen[g]) if(r<exs[e].sets) v.push({ex:e,set:r});
  return v;
}
function duurVan(exs,order=volgorde(exs),vanaf=0){
  let s=0;
  for(let i=vanaf;i<order.length;i++){
    s+=setDuur(exs[order[i].ex]);
    if(i<order.length-1&&!zelfdeGroep(exs[order[i].ex],exs[order[i+1].ex])) s+=REST_SECS;
  }
  return s;
}
const minuten=sec=>Math.max(1,Math.round(sec/60));
const UNIEK=(()=>{const z=new Set();return Object.values(SESSIONS).flatMap(s=>s.exercises).filter(o=>!z.has(o.naam)&&z.add(o.naam));})();
const idxVan=naam=>UNIEK.findIndex(o=>o.naam===naam);

// Datums in lokale tijd
const dagKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const vandaag=()=>dagKey(new Date());
const datumVan=k=>new Date(k+'T12:00:00');
function weekKey(d){const m=new Date(d);m.setDate(m.getDate()-(m.getDay()+6)%7);return dagKey(m);}
const fmtDag=k=>{const s=datumVan(k).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1);};
const fmtKort=k=>datumVan(k).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
function dezeWeek(){const w=weekKey(new Date());return hist.filter(h=>weekKey(datumVan(h.datum))===w).length;}
function weekReeks(){
  const weken=new Set(hist.map(h=>weekKey(datumVan(h.datum))));let n=0;const d=new Date();
  if(!weken.has(weekKey(d))) d.setDate(d.getDate()-7);
  while(weken.has(weekKey(d))){n++;d.setDate(d.getDate()-7);}
  return n;
}
function laatsteWeken(n){ // [{key,label,gedaan}] oudste eerst, incl. deze week
  const weken=new Set(hist.map(h=>weekKey(datumVan(h.datum)))),uit=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-7*i);const k=weekKey(d);
    uit.push({key:k,label:datumVan(k).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}).replace('.',''),gedaan:weken.has(k)});}
  return uit;
}
function geleden(datum){
  if(!datum) return 'nog niet gedaan';

  if(d<=0) return 'vandaag gedaan'; if(d===1) return 'gisteren gedaan';
  if(d<14) return `${d} dagen geleden`; return `${Math.round(d/7)} weken geleden`;
}

function ring(pct,groot,extra='',mid=''){ // pct 0..1

}
function houding(naam,i,tekst){

  const pool=UNIEK.filter(o=>!kortVrij||!o.gear).map(o=>({...o,super:undefined})).sort(()=>Math.random()-.5);
  const doel=kortMin*60,uit=[];let tot=0;
  for(const o of pool){const d=o.sets*setDuur(o)+(o.sets-1)*REST_SECS; if(uit.length&&tot+d>doel)break; tot+=d+(uit.length?REST_SECS:0); uit.push(o);}

}

// Vasthoud-oefening: timer op de klok, halverwege wisselen bij links en rechts
let holdT=null;
function holdKnop(){
  if(!hold)return;ontgrendelGeluid();
  if(hold.rest<=0){hold.rest=hold.tot;hold.gewisseld=false;}
  hold.loopt=!hold.loopt;
  if(hold.loopt){hold.eind=Date.now()+hold.rest*1000;clearInterval(holdT);holdT=setInterval(holdTik,200);}
  else clearInterval(holdT);
  tekenHold();
}
function holdTik(){
  if(!hold||!hold.loopt||tr?.pauzeVan)return;
  const nu=Math.max(0,Math.ceil((hold.eind-Date.now())/1000));
  if(nu===hold.rest)return;
  hold.rest=nu;
  if(hold.perKant&&!hold.gewisseld&&nu<=hold.tot/2&&nu>0){hold.gewisseld=true;toon1();zegWissel();}
  if(nu<=0){hold.loopt=false;clearInterval(holdT);toon3();$('klaar-btn')?.classList.add('pulse');}
  tekenHold();
}
let wisselTot=0;
function zegWissel(){ wisselTot=Date.now()+2500; }
function tekenHold(){
  const n=$('hold-n'),l=$('hold-l'),v=$('hold-val'),b=$('hold-btn');if(!n||!hold)return;
  n.textContent=hold.rest;
  const C=parseFloat(v.getAttribute('stroke-dasharray'));v.style.strokeDashoffset=C*(1-hold.rest/hold.tot);
  const wissel=Date.now()<wisselTot;
  l.textContent=wissel?'wissel':hold.perKant?(hold.gewisseld?'rechts':'links'):'sec';l.classList.toggle('wissel',wissel);
  b.innerHTML=hold.rest<=0?'Nog een keer':hold.loopt?'Pauze':`${I.play} ${hold.rest<hold.tot?'Verder':'Start'}`;
}
function openMenu(){ verbergToast();$('dim').classList.add('on');$('acts').classList.add('on');document.body.classList.add('vast'); }

// Klaar / overslaan met ongedaan maken
let snap=null,toastT=null;
const maakSnap=()=>({stap:tr.stap,order:[...tr.order],gedaan:[...tr.gedaan],sets:tr.sets});
function toast(t,s){ snap=s;$('toast-t').textContent=t;$('toast-b').hidden=!s;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(verbergToast,5000); }
function verbergToast(){ snap=null;clearTimeout(toastT);$('toast').classList.remove('on'); }
function ongedaan(){
  if(!snap||!tr)return;const s=snap;verbergToast();
  stopPauzeTimer();clearInterval(holdT);
  Object.assign(tr,{stap:s.stap,order:s.order,gedaan:s.gedaan,sets:s.sets});
  renderOefening(false);
}
function klaar(){
  const s=maakSnap(),o=huidigeEx();
  clearInterval(holdT);
  tr.sets++; if(!tr.gedaan.includes(tr.order[tr.stap].ex)) tr.gedaan.push(tr.order[tr.stap].ex);
  volgendeStap(o,s,'Ronde afgerond');
}
function overslaan(){
  if(!tr)return;const s=maakSnap(),o=huidigeEx(),e=tr.order[tr.stap].ex;
  clearInterval(holdT);
  tr.order=tr.order.filter((x,i)=>i<=tr.stap||x.ex!==e);
  volgendeStap(o,s,'Overgeslagen',true);
}
function volgendeStap(vorige,s,tekst,overgeslagen){
  tr.stap++;
  if(tr.stap>=tr.order.length){afronden();return;}
  const volgende=huidigeEx();
  if(!overgeslagen&&zelfdeGroep(vorige,volgende)) renderOefening(true);
  else if(overgeslagen) renderOefening(false);
  else pauze();
  toast(tekst,s);
}

// Pauze tussen blokken: blijft staan tot je op Verder tikt
let pauzeT=null,pauzeEind=0,pauzeS=0;
function pauze(){
  const n=huidigeEx();pauzeS=REST_SECS;pauzeEind=Date.now()+REST_SECS*1000;
  const rest=minuten(duurVan(tr.ex,tr.order,tr.stap));
  $('s-pauze').innerHTML=`
    <div class="wk-top"><button class="rond" onclick="openMenu()" aria-label="Opties">${I.dots}</button>
      <div class="prog"><div class="prog-t" style="margin:0">nog ongeveer ${rest} minuten</div></div><span style="width:2.75rem"></span></div>
    <div class="rest">
      <div class="eyebrow" id="p-eyebrow">Goed bezig</div>
      <h1 class="title2" style="font-size:1.65rem" id="p-titel">Even pauze</h1>
      <div class="ring" id="p-ring">${ring(1,220,'id="p-val"',`<div class="mid"><div><div class="n" id="p-n">${REST_SECS}</div><div class="l" id="p-l">seconden</div></div></div>`)}</div>
      <div class="sub" id="p-sub">Drink wat water en adem rustig.</div>
      <button class="card next" onclick="openUitleg(${idxVan(n.naam)})"><div class="thumb">${fig(n.naam,false)}</div>
        <div class="row-main"><div style="font-size:.78rem;color:var(--fg2)">Hierna</div><div class="row-t" style="font-weight:600">${naamVan(n)}</div><div class="row-s">${hoeveel(n)} · ${spullen(n)}</div></div>${I.chev}</button>
      <div class="duo"><button class="btn soft" onclick="extraPauze()">+15 sec</button><button class="btn" id="p-verder" onclick="naPauze()">Verder</button></div>
    </div>`;
  toon('pauze');bewaarLopend();
  stopPauzeTimer();pauzeT=setInterval(pauzeTik,250);
}
function pauzeTik(){
  if(tr?.pauzeVan)return;
  const nu=Math.max(0,Math.ceil((pauzeEind-Date.now())/1000));
  if(nu===pauzeS)return;pauzeS=nu;tekenPauze();
  if(nu<=0){stopPauzeTimer();toon3();
    $('p-titel').textContent='Klaar voor de volgende?';$('p-eyebrow').textContent='Pauze voorbij';
    $('p-sub').textContent='Tik op Verder als je zover bent.';$('p-verder').classList.add('pulse');}
}
function tekenPauze(){
  const n=$('p-n'),v=$('p-val');if(!n)return;
  n.textContent=pauzeS;const C=parseFloat(v.getAttribute('stroke-dasharray'));
  v.style.strokeDashoffset=C*(1-Math.min(pauzeS,REST_SECS)/REST_SECS);
}
function extraPauze(){
  if(pauzeS<=0){pauzeEind=Date.now();pauzeT=setInterval(pauzeTik,250);$('p-verder')?.classList.remove('pulse');$('p-titel').textContent='Even pauze';$('p-eyebrow').textContent='Goed bezig';$('p-sub').textContent='Drink wat water en adem rustig.';}
  pauzeEind+=15000;pauzeS+=15;tekenPauze();
}
function stopPauzeTimer(){clearInterval(pauzeT);pauzeT=null;}
function naPauze(){stopPauzeTimer();renderOefening(false);}

// Pauzeren (hele training) en stoppen
function pauzeer(){
  if(!tr||tr.pauzeVan)return;tr.pauzeVan=Date.now();laatWakeLockLos();
  $('paus-sub').textContent=`${tr.sets} ${tr.sets===1?'ronde':'rondes'} gedaan · ${Math.floor(tijdBezig()/60000)} min bezig`;
  $('paus-stop').textContent=tr.sets?'Stoppen en opslaan':'Stoppen';
  $('paus').classList.add('on');
}
function hervat(){
  if(!tr?.pauzeVan)return;const d=Date.now()-tr.pauzeVan;tr.pauzeMs+=d;tr.pauzeVan=null;
  pauzeEind+=d; if(hold?.loopt) hold.eind+=d;
  $('paus').classList.remove('on');vraagWakeLock();
}
function stopVanuitPauze(){ hervat(); if(tr.sets) afronden(); else stoppenZonderOpslaan(); }
function stoppenZonderOpslaan(){ opruimen();tab('vandaag'); }
function opruimen(){ stopPauzeTimer();clearInterval(holdT);verbergToast();LS.del(K_LOPEND);laatWakeLockLos();$('paus').classList.remove('on');tr=null; }

// ================= Klaar =================
let laatsteIdx=-1;
function afronden(){
  if(!tr)return;
  if(!tr.sets){stoppenZonderOpslaan();return;}
  const min=Math.max(1,Math.round(tijdBezig()/60000)),aantal=tr.gedaan.length;
  hist.push({datum:vandaag(),count:aantal,naam:tr.naam,key:tr.key,sets:tr.sets,min});
  laatsteIdx=hist.length-1;bewaarHist();
  const reeks=weekReeks();
  opruimen();
  $('s-klaar').innerHTML=`<div class="done">
    <div class="ring groen">${ring(0,132,'id="k-val"',`<div class="mid">${I.vinkGroot}</div>`)}</div>
    <h1 class="large" style="margin-bottom:.35rem">Goed gedaan</h1>
    <div class="sub">Je weekdoel is gehaald${reeks>1?`. ${reeks} weken op rij`:''}.</div>
    <div class="stats"><div class="card stat"><div class="n">${aantal}</div><div class="l">${aantal===1?'oefening':'oefeningen'}</div></div>
      <div class="card stat"><div class="n">${min}</div><div class="l">${min===1?'minuut':'minuten'}</div></div></div>
    <div class="card ask"><h3 id="zw-h">Hoe voelde het?</h3>
      <div class="seg" role="group" aria-labelledby="zw-h">${Object.entries(ZWAAR).map(([k,t])=>`<button aria-pressed="false" onclick="zetZwaar('${k}',this)">${t}</button>`).join('')}</div></div>
    <div class="card ask"><div class="pijn-top"><h3 style="margin:0" id="pijn-h">Pijn tijdens het trainen</h3><b id="pv">–</b></div>
      <input type="range" id="pijn" min="0" max="10" step="1" value="0" aria-labelledby="pijn-h" oninput="zetPijn(this.value)">
      <div class="scale"><span>0 · geen pijn</span><span>10 · heel veel</span></div></div>
    <div id="pijn-advies"></div>
    <div style="margin-top:1.3rem"><button class="btn" onclick="tab('vandaag')">Klaar</button></div>
  </div>`;
  toon('klaar');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const v=$('k-val');if(v)v.style.strokeDashoffset=0;}));
}
function zetZwaar(k,el){ el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el)); if(hist[laatsteIdx]){hist[laatsteIdx].zwaar=k;bewaarHist();} }
function zetPijn(v){
  v=+v;$('pv').textContent=v; if(hist[laatsteIdx]){hist[laatsteIdx].pijn=v;bewaarHist();}
  $('pijn-advies').innerHTML=v>=7?`<div class="melding warn" style="margin-top:.8rem;text-align:left">${I.let}<div><b>Dat is veel</b>Neem contact op met je fysio voor je volgende training. Stop als een oefening scherp pijn doet.</div></div>`:'';
}

// ================= Oefeningen-tab =================
let zoekTekst='',alleenVrij=false,kiezen=false,gekozen=new Set();
function renderOefeningen(){
  $('s-oefeningen').innerHTML=`
    <div class="navrij"><span></span><button class="link" onclick="kiesModus(!kiezen)">${kiezen?'Annuleer':'Kiezen'}</button></div>
    <h1 class="large">Oefeningen</h1>
    <label class="search">${I.zoek}<input id="zoek" type="search" placeholder="Zoeken" value="${zoekTekst}" oninput="zoekTekst=this.value;renderLijst()" aria-label="Zoek een oefening"></label>
    <div class="segwide" role="group" aria-label="Filter"><button aria-pressed="${!alleenVrij}" onclick="alleenVrij=false;renderOefeningen()">Alles</button><button aria-pressed="${alleenVrij}" onclick="alleenVrij=true;renderOefeningen()">Zonder spullen</button></div>
    ${kiezen?'<p class="foot" style="margin:-.3rem .2rem .7rem">Tik de oefeningen aan die je wilt doen.</p>':''}
    <div class="list" id="bib"></div>`;
  renderLijst();
}
function renderLijst(){
  const q=zoekTekst.trim().toLowerCase();
  const lijst=UNIEK.map((o,i)=>({o,i})).filter(({o})=>(!alleenVrij||!o.gear)&&(!q||(naamVan(o)+' '+o.naam+' '+uitlegVan(o)).toLowerCase().includes(q)));
  $('bib').innerHTML=lijst.length?lijst.map(({o,i})=>`<button class="row${gekozen.has(i)?' gekozen':''}" onclick="${kiezen?`kies(${i},this)`:`openUitleg(${i})`}" ${kiezen?`aria-pressed="${gekozen.has(i)}"`:''}>
    ${kiezen?`<div class="check">${I.vink}</div>`:''}<div class="thumb">${fig(o.naam,false)}</div>
    <div class="row-main"><div class="row-t">${naamVan(o)}</div><div class="row-s">${uitlegVan(o)}</div></div>${kiezen?'':I.chev}</button>`).join('')
    :`<div class="leeg">Geen oefening gevonden met "${zoekTekst.replace(/</g,'&lt;')}".</div>`;
}
function kiesModus(aan){ kiezen=aan; if(!aan)gekozen.clear(); if(huidig==='oefeningen'&&$('bib')) renderOefeningen(); updateKiesbalk(); }
function kies(i,el){ gekozen.has(i)?gekozen.delete(i):gekozen.add(i); el.classList.toggle('gekozen',gekozen.has(i)); el.setAttribute('aria-pressed',gekozen.has(i)); updateKiesbalk(); }
function updateKiesbalk(){
  const n=gekozen.size;$('kiesbalk').classList.toggle('on',kiezen&&n>0);
  if(n){const exs=[...gekozen].map(i=>({...UNIEK[i],super:undefined}));$('kies-start').textContent=`Start ${n} ${n===1?'oefening':'oefeningen'} · ${minuten(duurVan(exs))} min`;}
}
function startGekozen(){ const exs=[...gekozen].map(i=>({...UNIEK[i],super:undefined})); if(!exs.length)return; kiesModus(false); startLijst(exs,exs.length===1?naamVan(exs[0]):'Eigen selectie',null); }

// ================= Voortgang =================
function renderVoortgang(){
  const reeks=weekReeks(),w8=laatsteWeken(8),recent=[...hist].reverse().slice(0,12);
  $('s-voortgang').innerHTML=`
    <div class="eyebrow">&nbsp;</div>
    <h1 class="large">Voortgang</h1>
    <div class="card big"><div class="ring groen">${ring(Math.min(1,w8.filter(w=>w.gedaan).length/8),64,'',`<div class="mid" style="color:var(--green)">${I.vlam}</div>`)}</div>
      <div><div class="n">${reeks}</div><div class="sub">${reeks===1?'week':'weken'} op rij je weekdoel gehaald</div></div></div>
    <div class="weeks" aria-label="Laatste 8 weken">${w8.map(w=>`<div class="wkb${w.gedaan?' on':''}" title="Week van ${w.label}${w.gedaan?': getraind':''}"><i></i>${w.label}</div>`).join('')}</div>
    <div class="section">Recente trainingen</div>
    <div class="list">${recent.length?recent.map(h=>`<div class="row plain"><div class="row-main"><div class="row-t">${trainingNaam(h)}</div><div class="row-s">${fmtDag(h.datum)}${h.count?` · ${h.count} ${h.count===1?'oefening':'oefeningen'}`:''}</div></div>
      ${h.zwaar?`<span class="pill ${h.zwaar==='zwaar'||h.zwaar==='tezwaar'?'w':'g'}">${ZWAAR[h.zwaar]}</span>`:''}${h.pijn!=null?`<span class="pill${h.pijn>=7?' w':''}">pijn ${h.pijn}</span>`:''}</div>`).join('')
      :`<div class="leeg">Nog geen trainingen. Je eerste training verschijnt hier.</div>`}</div>
    ${recent.length?`<p class="foot">Na elke training vul je in hoe het voelde. Zo kan je fysio zien hoe het gaat.</p>
    <div style="margin-top:1rem"><button class="btn soft" onclick="deel()">${I.deel} Deel met je fysio</button></div>`:''}`;
}
async function deel(){
  const regels=[...hist].reverse().slice(0,10).map(h=>`- ${fmtKort(h.datum)}: ${trainingNaam(h)}${h.count?`, ${h.count} oefeningen`:''}${h.zwaar?`, voelde ${ZWAAR[h.zwaar].toLowerCase()}`:''}${h.pijn!=null?`, pijn ${h.pijn}/10`:''}`);
  const tekst=`Mijn trainingen (${weekReeks()} weken op rij):\n${regels.join('\n')}`;
  try{ if(navigator.share){await navigator.share({title:'Mijn trainingen',text:tekst});return;} }catch(e){ if(e.name==='AbortError')return; }
  try{ await navigator.clipboard.writeText(tekst); toast('Gekopieerd, plak het in een bericht',null); }
  catch(e){ openSheet(`<div class="sheet-top"><h2 class="title2">Overzicht</h2>${sluitKnop}</div><pre style="white-space:pre-wrap;font:inherit;font-size:.9rem">${tekst}</pre>`); }
}

// ================= Lopende training bewaren =================
function bewaarLopend(){ if(tr) LS.set(K_LOPEND,{t:Date.now(),naam:tr.naam,key:tr.key,ex:tr.ex,order:tr.order,stap:tr.stap,gedaan:tr.gedaan,sets:tr.sets,bezig:tijdBezig()}); }
function leesLopend(){ const v=LS.get(K_LOPEND,null); if(v&&v.ex&&v.order&&Date.now()-v.t<6*36e5) return v; if(v)LS.del(K_LOPEND); return null; }
function hervatLopend(){
  const v=leesLopend();if(!v){renderVandaag();return;}
  ontgrendelGeluid();
  tr={naam:v.naam,key:v.key,ex:v.ex,order:v.order,stap:v.stap,gedaan:v.gedaan,sets:v.sets,start:Date.now()-v.bezig,pauzeMs:0,pauzeVan:null};
  vraagWakeLock();renderOefening(false);
}

// ================= Geluid, scherm aan =================
let audio=null;
function ontgrendelGeluid(){
  try{
    if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();
      const b=audio.createBuffer(1,1,22050),s=audio.createBufferSource();s.buffer=b;s.connect(audio.destination);s.start(0);}
    if(audio.state==='suspended')audio.resume();
  }catch(e){}
}
function toonGeluid(tijden,freq){
  try{ if(!audio)return; if(audio.state==='suspended')audio.resume();
    tijden.forEach((t,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq[i]||freq[0];
      o.connect(g);g.connect(audio.destination);const s=audio.currentTime+t;
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.45);o.start(s);o.stop(s+.5);});
  }catch(e){}
}
const toon1=()=>toonGeluid([0],[660]);            // wissel van kant
const toon3=()=>toonGeluid([0,.22,.44],[660,784,988]); // klaar
document.addEventListener('touchend',ontgrendelGeluid,{passive:true});
document.addEventListener('click',ontgrendelGeluid);
let wakeLock=null;
async function vraagWakeLock(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
function laatWakeLockLos(){ if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;} }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!tr)return;
  if(!tr.pauzeVan) vraagWakeLock();
  pauzeTik();holdTik();
});

// ================= Start =================
(function start(){
  const q=new URLSearchParams(location.search);
  if(q.get('mode')==='quick'){ // snelkoppeling: oefening van de dag
    const dag=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
    startLos(dag%UNIEK.length);return;
  }
  if(!LS.get(K_WELKOM,0)&&!hist.length){toon('welkom');return;}
  tab('vandaag');
})();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
